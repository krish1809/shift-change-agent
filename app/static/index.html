<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift-Change Agent</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e2e6ec;--accent:#2457d6;--ok:#12805c;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:12px 20px;background:var(--ink);color:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1}header small{opacity:.7}
main{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;padding:16px;max-width:1200px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:420px}
section>h2{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;padding:10px 14px;align-items:center;flex-wrap:wrap}
select,input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}button.ghost{background:#fff;color:var(--accent)}
button.bad{background:var(--bad);border-color:var(--bad)}
#log{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;max-height:460px}
.m{padding:8px 12px;border-radius:10px;max-width:85%;white-space:pre-wrap}.u{align-self:flex-end;background:var(--accent);color:#fff}
.a{align-self:flex-start;background:#eef1f6}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.meta{font-size:12px;color:var(--mute);padding:0 14px 8px}form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}form input{flex:1}
.req{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 14px}.req b{color:var(--accent)}
.tools{padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head><body>
<header><h1>Shift-Change Agent <small>employee chat + manager console (demo)</small></h1>
<span class="tools" style="border:0;color:#fff;padding:0">Demo clock <input id="clk" placeholder="2026-03-02T17:30:00+05:30" size="26"><button class="ghost" onclick="setClock()">Set</button><button class="ghost" onclick="armFault()">Arm tool timeout</button></span></header>
<main>
<section><h2>Employee chat</h2>
<div class="row"><select id="emp"></select><button class="ghost" onclick="signIn()">Sign in</button><button class="ghost" onclick="newChat()">New chat</button></div>
<div id="log"></div><div class="meta" id="meta"></div>
<form onsubmit="send(event)"><input id="msg" placeholder="e.g. move my drop today to 8:30 pm" autocomplete="off"><button>Send</button></form></section>
<section><h2>Transport manager console</h2>
<div class="row"><select id="mgr"></select><button class="ghost" onclick="mgrIn()">Sign in</button><button class="ghost" onclick="loadReqs()">Refresh</button></div>
<div id="reqs"></div></section></main>
<script>
const $=id=>document.getElementById(id);let tok=null,mtok=null,session=null,seen=0;
async function api(path,opt={},t){const r=await fetch(path,{...opt,headers:{'content-type':'application/json',...(t?{authorization:'Bearer '+t}:{})}});return {ok:r.ok,status:r.status,data:await r.json()}}
async function init(){const {data}=await api('/dev/people');
 for(const p of data.people){const o=new Option(`${p.name} (${p.id}, ${p.company_name})`,JSON.stringify([p.company_id,p.id]));($(p.role==='manager'?'mgr':'emp')).add(o)}
 await signIn();await mgrIn()}
async function token(v){const [c,e]=JSON.parse(v);return (await api('/dev/token',{method:'POST',body:JSON.stringify({company_id:c,employee_id:e})})).data.token}
async function signIn(){tok=await token($('emp').value);newChat()}
async function mgrIn(){mtok=await token($('mgr').value);loadReqs()}
function newChat(){session=null;seen=0;$('log').innerHTML='';$('meta').textContent=''}
function bubble(text,cls,opts){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;
 if(opts&&opts.length){const c=document.createElement('div');c.className='chips';for(const o of opts){const b=document.createElement('button');b.className='ghost';b.textContent=`${o.ref}) ${o.time}`;b.onclick=()=>say('option '+o.ref);c.append(b)}d.append(c)}
 $('log').append(d);$('log').scrollTop=1e9}
async function say(text){bubble(text,'u');const r=await api('/chat',{method:'POST',body:JSON.stringify({message:text,...(session?{session_id:session}:{})})},tok);
 const d=r.data;session=d.session_id||session;bubble(d.reply,'a',d.options);seen+=2;
 if(d.meta)$('meta').textContent=`status ${d.status} · ${d.meta.llm_calls} LLM call(s) · ${d.meta.latency_ms} ms · ${d.meta.correlation_id}`}
function send(e){e.preventDefault();const t=$('msg').value.trim();if(!t)return;$('msg').value='';say(t)}
async function poll(){if(!session)return;const r=await api(`/chat/${session}/messages`,{},tok);const m=r.data.messages||[];
 if(m.length>seen){for(const x of m.slice(seen))bubble(x.content,x.role==='user'?'u':'a');seen=m.length}}
async function loadReqs(){const r=await api('/manager/requests?status=PENDING_APPROVAL',{},mtok);const box=$('reqs');box.innerHTML='';
 const list=r.data.requests||[];if(!list.length)box.innerHTML='<div class="meta">No requests waiting for a decision.</div>';
 for(const q of list){const d=document.createElement('div');d.className='req';d.innerHTML=`<b>${q.id}</b> · ${q.employee_id} · ${q.change_type}<br><small>since ${q.created_at}</small>`;
  const note=document.createElement('input');note.placeholder='note (optional)';const a=document.createElement('button');a.textContent='Approve';const x=document.createElement('button');x.textContent='Reject';x.className='bad';
  a.onclick=()=>decide(q.id,'approve',note.value);x.onclick=()=>decide(q.id,'reject',note.value);const row=document.createElement('div');row.className='row';row.append(note,a,x);d.append(row);box.append(d)}}
async function decide(id,decision,note){await api(`/manager/requests/${id}/decision`,{method:'POST',body:JSON.stringify({decision,...(note?{note}:{})})},mtok);loadReqs();poll()}
async function setClock(){await api('/dev/clock',{method:'POST',body:JSON.stringify({now:$('clk').value||null})})}
async function armFault(){await api('/dev/faults',{method:'POST',body:JSON.stringify({tool:'check_cab_options',mode:'timeout'})});alert('check_cab_options will time out')}
setInterval(poll,2000);setInterval(loadReqs,5000);init();
</script></body></html>
