<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift-Change Agent · demo</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b2430;--mute:#677385;--line:#e1e5eb;--accent:#2457d6;--accent-soft:#e8eefc;
--ok:#12805c;--ok-soft:#e3f4ec;--warn:#9a6700;--warn-soft:#fff4d6;--bad:#b3261e;--bad-soft:#fde8e6;--wait:#6a3fb5;--wait-soft:#efe8fb}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,select,input{font:inherit}
header{background:var(--ink);color:#fff;padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header h1{font-size:15px;margin:0;font-weight:600}
header .sub{opacity:.65;font-size:12px}
.toolbar{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.toolbar .clock{background:#2c3746;padding:5px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
.toolbar .clock.over{background:#7a5a00}
.tb{background:#2c3746;color:#fff;border:1px solid #3d4a5c;border-radius:6px;padding:5px 9px;cursor:pointer}
.tb:hover{background:#3a4759}.tb.danger{border-color:#8a3a33}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;padding:14px;max-width:1280px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0}
.panel>h2{font-size:13px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel>h2 .pill{font-weight:500}
.row{display:flex;gap:8px;padding:10px 14px;align-items:center;flex-wrap:wrap}
select,input[type=text]{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;min-width:0}
.btn{padding:7px 12px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent)}.btn.small{padding:4px 9px;font-size:12px}
.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.bad{background:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.idcard{margin:0 14px 10px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:12px;color:var(--mute);display:none}
.idcard b{color:var(--ink);font-weight:600}.idcard code{background:#f1f3f6;padding:1px 5px;border-radius:4px;color:var(--ink)}
.trips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.trip{font-size:12px;padding:4px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.trip.flash{animation:flash 1.4s}.trip.cancelled{background:#eceff3;color:var(--mute);text-decoration:line-through}
@keyframes flash{0%{background:#ffe58a}100%{background:var(--accent-soft)}}
#log{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:300px;max-height:52vh;border-top:1px solid var(--line)}
.empty{color:var(--mute);font-size:13px;margin:auto;text-align:center;max-width:340px}
.msg{max-width:88%;display:flex;flex-direction:column;gap:4px}
.msg.u{align-self:flex-end;align-items:flex-end}.msg.a{align-self:flex-start}
.bubble{padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.u .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.a .bubble{background:#eef1f6;border-bottom-left-radius:3px}
.a.note .bubble{background:var(--wait-soft);border:1px solid #d9c8f5}
.meta{font-size:11px;color:var(--mute)}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;display:inline-block;width:max-content}
.s-ok{background:var(--ok-soft);color:var(--ok)}.s-needs_clarification{background:var(--warn-soft);color:var(--warn)}
.s-rejected{background:var(--bad-soft);color:var(--bad)}.s-pending_approval{background:var(--wait-soft);color:var(--wait)}
.s-error{background:var(--bad-soft);color:var(--bad)}.s-note{background:var(--wait-soft);color:var(--wait)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--accent);color:var(--accent);background:#fff;border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px}
.chip:hover{background:var(--accent-soft)}
.suggest{padding:8px 14px 0;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line)}
.suggest .chip{border-color:var(--line);color:var(--ink)}
form{display:flex;gap:8px;padding:10px 14px}form input{flex:1}
.tabs{display:flex;gap:4px;padding:0 14px}
.tab{border:1px solid var(--line);background:#fff;padding:5px 10px;border-radius:7px;cursor:pointer;font-size:12px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#reqs{padding:10px 14px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:62vh}
.req{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.req .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.req .who{font-weight:600}.req .id{font-family:ui-monospace,monospace;font-size:12px;color:var(--mute)}
.req .sum{font-size:13px}.req .why{font-size:12px;color:var(--warn)}
.req .act{display:flex;gap:6px;flex-wrap:wrap}.req .act input{flex:1;min-width:120px}
.trail{font-size:12px;border-top:1px dashed var(--line);padding-top:6px;color:var(--mute)}
.trail div{display:grid;grid-template-columns:62px 120px 1fr;gap:6px}
.trail b{color:var(--ink);font-weight:500}
.hint{font-size:12px;color:var(--mute);padding:0 14px 8px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div><h1>Shift-Change Agent</h1><div class="sub">employee chat · transport manager console · demo controls</div></div>
  <div class="toolbar">
    <span class="clock" id="clock" title="The time the agent uses for cut-off rules">clock …</span>
    <button class="tb" onclick="setTime('15:00')" title="Before every cut-off">3:00 PM</button>
    <button class="tb" onclick="setTime('17:30')" title="After Acme's 5:00 PM drop cut-off for the 7:00 PM cab">5:30 PM</button>
    <button class="tb" onclick="setTime('18:45')" title="After Globex's 6:30 PM drop cut-off for the 7:30 PM cab">6:45 PM</button>
    <button class="tb" onclick="setTime(null)" title="Use the real time">real time</button>
    <button class="tb" id="faultBtn" onclick="toggleFault()" title="Make the cab-options tool time out">arm tool timeout</button>
    <button class="tb danger" onclick="resetDemo()" title="Reload seed data for the clock's date and clear all chats">reset demo data</button>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Employee chat <span class="pill s-note" id="modePill" style="display:none">waiting for manager</span></h2>
    <div class="row">
      <select id="emp" aria-label="Employee"></select>
      <button class="btn ghost" onclick="signIn()">Sign in</button>
      <button class="btn ghost" onclick="newChat()">New chat</button>
    </div>
    <div class="idcard" id="empId"></div>
    <div class="trips" id="trips"></div>
    <div id="log"></div>
    <div class="suggest" id="suggest"></div>
    <form onsubmit="send(event)">
      <input type="text" id="msg" placeholder="e.g. move my drop today to 8:30 pm" autocomplete="off" maxlength="1000">
      <button class="btn" id="sendBtn">Send</button>
    </form>
  </section>

  <section class="panel">
    <h2>Transport manager console</h2>
    <div class="row">
      <select id="mgr" aria-label="Manager"></select>
      <button class="btn ghost" onclick="mgrIn()">Sign in</button>
    </div>
    <div class="idcard" id="mgrId"></div>
    <div class="tabs"><button class="tab on" id="tabPending" onclick="setTab('pending')">Pending</button>
      <button class="tab" id="tabAll" onclick="setTab('all')">History</button></div>
    <div class="hint" id="isoHint"></div>
    <div id="reqs"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const STATUS = {ok: "ok", needs_clarification: "question", rejected: "not possible", pending_approval: "waiting for manager", error: "problem"};
const SUGGEST = ["Move my drop today to 9 pm", "Can I go a bit late today?", "Make it 9 instead", "I want the 8 pm drop",
  "What's my schedule?", "What's the cut-off?", "Any update on my request?", "Withdraw it", "Cancel my pickup tomorrow", "thanks!"];
let emp = null, mgr = null, session = null, rendered = 0, busy = false, tab = "pending", faultArmed = false;

async function api(path, opt = {}, token) {
  const r = await fetch(path, {...opt, headers: {"content-type": "application/json", ...(token ? {authorization: "Bearer " + token} : {})}});
  let data = {}; try { data = await r.json(); } catch (_) {}
  return {ok: r.ok, status: r.status, data};
}
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2200); }
function claims(token) {
  const part = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
  return JSON.parse(atob(part + "=".repeat((4 - part.length % 4) % 4)));
}
function idCard(box, who) {
  const c = claims(who.token); box.replaceChildren(); box.style.display = "block";
  const line1 = el("div"); line1.append("Signed in with a JWT (HS256) — ", el("b", null, who.name),
    "  ·  company_id ", el("code", null, c.company_id), "  sub ", el("code", null, c.sub), "  role ", el("code", null, c.role));
  const line2 = el("div", null, `expires ${new Date(c.exp * 1000).toLocaleString()} · sent as "Authorization: Bearer …" on every call; ` +
    "the request body never carries identity.");
  box.append(line1, line2);
}

async function init() {
  const {data} = await api("/dev/people");
  for (const p of data.people || []) {
    const o = new Option(`${p.name} (${p.id}, ${p.company_name})`, JSON.stringify([p.company_id, p.id]));
    $(p.role === "manager" ? "mgr" : "emp").add(o);
  }
  for (const s of SUGGEST) { const c = el("button", "chip", s); c.type = "button"; c.onclick = () => say(s); $("suggest").append(c); }
  await Promise.all([signIn(), mgrIn(), tick()]);
}
async function mint(value) {
  const [company_id, employee_id] = JSON.parse(value);
  const r = await api("/dev/token", {method: "POST", body: JSON.stringify({company_id, employee_id})});
  return {token: r.data.token, name: r.data.name, company_id};
}
async function signIn() { emp = await mint($("emp").value); idCard($("empId"), emp); newChat(); isoHint(); }
async function mgrIn() { mgr = await mint($("mgr").value); idCard($("mgrId"), mgr); isoHint(); loadReqs(); }
function isoHint() {
  $("isoHint").textContent = emp && mgr && emp.company_id !== mgr.company_id
    ? "This manager is in a different company from the employee, so their requests will never appear here (cross-company isolation)."
    : "";
}

function newChat() {
  session = null; rendered = 0; $("log").replaceChildren(); $("modePill").style.display = "none";
  const e = el("div", "empty", "Ask about your cab, e.g. “move my drop today to 9 pm”, or click a suggestion below.");
  $("log").append(e); loadTrips();
}
async function loadTrips(flash) {
  if (!emp) return;
  const r = await api("/me/roster", {}, emp.token); const box = $("trips"); const before = box.textContent; box.replaceChildren();
  for (const e of r.data.entries || []) {
    const when = e.scheduled_at ? new Date(e.scheduled_at).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}) : "cancelled";
    const chip = el("span", "trip" + (e.status === "cancelled" ? " cancelled" : ""), `${e.trip_type} ${e.date.slice(5)} · ${when}`);
    chip.title = e.cab || ""; box.append(chip);
  }
  if (flash && before && before !== box.textContent) for (const c of box.children) c.classList.add("flash");
}

function addMessage(role, text, extra = {}) {
  const log = $("log"); log.querySelector(".empty")?.remove();
  const m = el("div", "msg " + role + (extra.note ? " note" : ""));
  if (extra.note) m.append(el("span", "pill s-note", "update from your manager"));
  else if (extra.status) m.append(el("span", "pill s-" + extra.status, STATUS[extra.status] || extra.status));
  m.append(el("div", "bubble", text));
  if (extra.options && extra.options.length) {
    const chips = el("div", "chips");
    for (const o of extra.options) {
      const label = `${o.ref}) ${o.time}` + (o.seats_left != null ? ` · ${o.seats_left} seat${o.seats_left === 1 ? "" : "s"}` : "") +
        (o.needs_approval && o.needs_approval.length ? " · needs approval" : "");
      const b = el("button", "chip", label); b.type = "button"; b.onclick = () => say(`option ${o.ref}`); chips.append(b);
    }
    m.append(chips);
  }
  if (extra.meta) {
    const t = extra.meta;
    m.append(el("div", "meta", `${t.llm_calls} LLM call${t.llm_calls === 1 ? "" : "s"} · ${t.latency_ms} ms` +
      (t.tools && t.tools.length ? ` · tool: ${t.tools.join(", ")}` : " · no tool") + (t.outcome ? ` · ${t.outcome}` : "")));
  }
  log.append(m); log.scrollTop = log.scrollHeight;
}

async function say(text) {
  if (busy || !emp) return; busy = true; $("sendBtn").disabled = true;
  addMessage("u", text);
  try {
    const r = await api("/chat", {method: "POST", body: JSON.stringify({message: text, ...(session ? {session_id: session} : {})})}, emp.token);
    const d = r.data; session = d.session_id || session;
    addMessage("a", d.reply || "Something went wrong.", {status: d.status || "error", options: d.options, meta: d.meta});
    $("modePill").style.display = d.status === "pending_approval" || (d.meta && d.meta.outcome === "PENDING_BLOCKED") ? "inline-block" : "none";
    await syncCount(); await loadTrips(true); loadReqs();
  } finally { busy = false; $("sendBtn").disabled = false; $("msg").focus(); }
}
function send(e) { e.preventDefault(); const t = $("msg").value.trim(); if (!t) return; $("msg").value = ""; say(t); }
async function syncCount() {
  if (!session) return; const r = await api(`/chat/${session}/messages`, {}, emp.token); rendered = (r.data.messages || []).length;
}
async function poll() {
  if (!session || busy) return;
  const r = await api(`/chat/${session}/messages`, {}, emp.token); const list = r.data.messages || [];
  if (list.length > rendered) {
    for (const m of list.slice(rendered)) if (m.role === "assistant") addMessage("a", m.content, {note: true});
    rendered = list.length; $("modePill").style.display = "none"; loadTrips(true);
  }
}

function setTab(name) { tab = name; $("tabPending").classList.toggle("on", name === "pending"); $("tabAll").classList.toggle("on", name === "all"); loadReqs(); }
async function loadReqs() {
  if (!mgr) return;
  const r = await api("/manager/requests?status=" + (tab === "pending" ? "PENDING_APPROVAL" : ""), {}, mgr.token);
  const box = $("reqs"); box.replaceChildren(); const list = r.data.requests || [];
  if (!list.length) box.append(el("div", "empty", tab === "pending" ? "No requests waiting for a decision." : "No requests yet."));
  for (const q of list) box.append(requestCard(q));
}
function requestCard(q) {
  const card = el("div", "req");
  const top = el("div", "top"); top.append(el("span", "who", `${q.employee_name} (${q.employee_id})`), el("span", "id", `${q.id} · ${q.created_label}`));
  card.append(top, el("div", "sum", q.summary));
  if (q.reasons && q.reasons.length) card.append(el("div", "why", "Needs approval: " + q.reasons.join(", ")));
  if (q.status !== "PENDING_APPROVAL") {
    card.append(el("span", "pill " + (q.status.includes("APPLIED") ? "s-ok" : "s-rejected"),
      q.status.toLowerCase().replace(/_/g, " ") + (q.decided_by ? ` · by ${q.decided_by}` : "") + (q.decision_note ? ` · “${q.decision_note}”` : "")));
  }
  const act = el("div", "act");
  if (q.status === "PENDING_APPROVAL") {
    const note = el("input"); note.type = "text"; note.placeholder = "note for the employee (optional)"; note.maxLength = 300;
    const yes = el("button", "btn ok small", "Approve"), no = el("button", "btn bad small", "Reject");
    yes.onclick = () => decide(q.id, "approve", note.value); no.onclick = () => decide(q.id, "reject", note.value);
    act.append(note, yes, no);
  }
  const trailBtn = el("button", "btn ghost small", "Audit trail"); act.append(trailBtn); card.append(act);
  trailBtn.onclick = async () => {
    const existing = card.querySelector(".trail"); if (existing) { existing.remove(); return; }
    const t = await api(`/manager/requests/${q.id}/audit`, {}, mgr.token); const box = el("div", "trail");
    for (const e of t.data.events || []) {
      const row = el("div"); row.append(el("span", null, new Date(e.at).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"})),
        el("span", null, e.actor), el("b", null, e.action.toLowerCase().replace(/_/g, " "))); box.append(row);
    }
    card.append(box);
  };
  return card;
}
async function decide(id, decision, note) {
  const r = await api(`/manager/requests/${id}/decision`, {method: "POST", body: JSON.stringify({decision, ...(note ? {note} : {})})}, mgr.token);
  toast(r.ok ? `${decision === "approve" ? "Approved" : "Rejected"} ${id}` : (r.data.reply || "Could not record the decision"));
  loadReqs(); setTimeout(poll, 300);
}

async function tick() {
  const r = await api("/dev/clock"); if (!r.ok) return;
  const d = new Date(r.data.now); const c = $("clock");
  c.textContent = "agent clock " + d.toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"}) + (r.data.overridden ? " (demo)" : "");
  c.classList.toggle("over", !!r.data.overridden);
}
async function setTime(hhmm) {
  let now = null;
  if (hhmm) {
    const r = await api("/dev/clock"); const date = r.data.now.slice(0, 10);
    now = `${date}T${hhmm}:00+05:30`;
  }
  await api("/dev/clock", {method: "POST", body: JSON.stringify({now})});
  // tokens carry exp/iat from the agent clock, so re-issue them for the new time (the chat is kept)
  emp = await mint($("emp").value); mgr = await mint($("mgr").value); idCard($("empId"), emp); idCard($("mgrId"), mgr);
  await tick(); await loadTrips(); loadReqs(); toast(hhmm ? `Agent clock set to ${hhmm}` : "Using real time");
}
async function toggleFault() {
  faultArmed = !faultArmed;
  await api("/dev/faults", {method: "POST", body: JSON.stringify({tool: "check_cab_options", mode: faultArmed ? "timeout" : null})});
  $("faultBtn").textContent = faultArmed ? "clear tool timeout" : "arm tool timeout";
  toast(faultArmed ? "check_cab_options will now time out (try: what drops are there tonight?)" : "Tool timeout cleared");
}
async function resetDemo() {
  if (!confirm("Reload the seed data for the agent clock's date and clear every chat?")) return;
  const r = await api("/dev/reseed", {method: "POST"}); faultArmed = false; $("faultBtn").textContent = "arm tool timeout";
  newChat(); loadReqs(); toast(r.ok ? `Demo data reset (today = ${r.data.base_date})` : "Reset failed");
}

setInterval(poll, 2000); setInterval(() => { if (tab === "pending") loadReqs(); }, 5000); setInterval(tick, 30000);
init();
</script>
</body>
</html>
